<script>
(function () {
  var p = JSON.parse(document.getElementById('paket').textContent);
  var f = document.getElementById('f'), u = document.getElementById('u'),
      b = document.getElementById('b'), g = document.getElementById('s');

  function b64(s) {
    var ham = atob(s), a = new Uint8Array(ham.length);
    for (var i = 0; i < ham.length; i++) { a[i] = ham.charCodeAt(i); }
    return a;
  }

  if (!(window.crypto && window.crypto.subtle)) {
    u.textContent = 'Tarayıcınız gerekli güvenlik özelliklerini desteklemiyor. ' +
                    'Güncel Chrome, Edge, Firefox ya da Safari kullanın.';
    b.textContent = 'Açılamıyor';
    return;
  }

  // Paket okundu, cozme hazir: alanlari ac.
  g.disabled = false;
  b.disabled = false;
  b.textContent = 'Sunumu aç';
  try { g.focus(); } catch (e) {}

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    u.textContent = '';
    b.disabled = true;
    b.textContent = 'Çözülüyor…';

    var kod = new TextEncoder().encode(g.value);
    crypto.subtle.importKey('raw', kod, 'PBKDF2', false, ['deriveKey'])
      .then(function (ham) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64(p.tuz), iterations: p.dongu, hash: 'SHA-256' },
          ham, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (anahtar) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) },
                                     anahtar, b64(p.veri));
      })
      .then(function (paket) {
        // gzip çözme: tarayıcının kendi akışı
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('eskiTarayici');
        }
        var akis = new Response(paket).body
                     .pipeThrough(new DecompressionStream('gzip'));
        return new Response(akis).text();
      })
      .then(function (belge) {
        document.open();
        document.write(belge);
        document.close();
      })
      .catch(function (hata) {
        b.disabled = false;
        b.textContent = 'Sunumu aç';
        if (hata && hata.message === 'eskiTarayici') {
          u.textContent = 'Tarayıcınız gzip çözmeyi desteklemiyor; güncelleyin.';
        } else {
          u.textContent = 'Şifre yanlış. Tekrar deneyin.';
        }
        g.select();
      });
  });
})();
</script>
